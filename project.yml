name: TrainingApp
options:
  bundleIdPrefix: org.oekalegon
  deploymentTarget:
    iOS: "26.0"

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

packages:
  TrainingAppKit:
    path: TrainingAppKit
  TrainingWatchKit:
    path: TrainingWatchKit

targets:
  TrainingApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iOS/Sources
    resources:
      - path: iOS/Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        # Lets CloudKit silent push notifications wake the app to sync while backgrounded.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oekalegon.trainingapp
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/TrainingApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "TrainingApp reads your workouts and heart-rate data to compute your training load and fitness trend."
        # Some HealthKit APIs require this present even for read-only access (see TrainingKit's HealthKitHarness).
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "TrainingApp does not write any data to Health; this key is required by some HealthKit APIs even when only read access is requested."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TrainingAppKit
      - target: TrainingWatch
        embed: true
    scheme:
      testTargets: []
      gatherCoverageData: false

  # Companion Apple Watch app (WATCH-101, docs/design/watch-app.md).
  TrainingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: watchOS/Sources
    dependencies:
      - package: TrainingWatchKit
    info:
      path: Generated/WatchInfo.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.oekalegon.trainingapp
        NSHealthShareUsageDescription: "TrainingApp reads your heart rate and running measurements, such as cadence and power, during a run to show them."
        NSHealthUpdateUsageDescription: "TrainingApp saves your runs, with their heart rate and running measurements, to Health."
        NSLocationWhenInUseUsageDescription: "TrainingApp records the route of your run."
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oekalegon.trainingapp.watchkitapp
        CODE_SIGN_ENTITLEMENTS: watchOS/Resources/TrainingWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "4"

# The watch scheme carries the simulator's test arguments. The ones that start the 4 x 90 s alert
# test run on the matching GPX track by themselves are on (they are ignored on a real watch).
# For the 6 x 20 s interval run, untick -fakeAlertPlan and the alert-test track and tick
# -fakeIntervalPlan and the short-intervals track, in Xcode under Product > Scheme > Edit Scheme >
# Run > Arguments.
schemes:
  TrainingWatch:
    build:
      targets:
        TrainingWatch: all
    run:
      config: Debug
      commandLineArguments:
        "-fakeZones": true
        "-fakeIntervalPlan": false
        "-fakePlan": false
        "-fakeShortPlan": false
        "-fakeAlertPlan": true
        "-fakeBattery": false
        "-fakeDimmed": false
        "-batteryLevel 0.25": true
        "-batteryDrainPerHour 3.0": true
        "-autostartPlan": true
        "-gpxPath $(SRCROOT)/Tools/TestTracks/short-intervals.gpx": false
        "-gpxPath $(SRCROOT)/Tools/TestTracks/alert-test.gpx": true
